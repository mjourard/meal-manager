name: Lint Code

on:
  push:
    branches: [ '**' ]
  workflow_call:
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Diffs the whole push/PR (not just the head commit) against .github/path-filters.yml
      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml

  lint-api:
    name: Lint API (Java)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Java version from pom.xml
        id: get_java_version
        run: |
          JAVA_VERSION=$(grep -A 1 '<java.version>' api/pom.xml | grep -oP '(?<=>)\d+(?=<)')
          echo "java_version=$JAVA_VERSION" >> $GITHUB_OUTPUT
          echo "java_version=$JAVA_VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.get_java_version.outputs.java_version }}
          distribution: 'corretto'
          cache: maven

      - name: Run checkstyle
        run: cd api && mvn -B checkstyle:check -Denvfile.skip=true

  lint-client:
    name: Lint Client (TypeScript)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: client/package.json
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

  lint-terraform:
    name: Lint Terraform
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.terraform == 'true' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Terraform version
        id: get_tf_version
        uses: ./.github/actions/get-terraform-version
        with:
          manifest_path: deploy/terraform/manifests/dns/providers.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.get_tf_version.outputs.terraform_version }}

      - name: Check formatting
        working-directory: deploy/terraform/manifests/dns
        run: |
          terraform init -backend=false
          terraform validate
          terraform fmt -check -recursive
